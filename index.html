<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كل سنة وانتي طيبة يا SoUu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#fff1f3;--bg2:#f4d3e3;--ink:#5e2440;--soft:#94587a;--card:rgba(255,255,255,.84);--line:rgba(212,87,122,.3);--btn:#d4577a;--btnink:#fff;--p1:#d4577a;--p2:#e8894e;--p3:#8b6ad1;--p4:#c2477a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1b0f2a;--bg2:#3a1630;--ink:#ffe8ee;--soft:#e3adc3;--card:rgba(58,22,48,.84);--line:rgba(255,143,171,.34);--btn:#ff8fab;--btnink:#3a1630;--p1:#ff8fab;--p2:#ffd68a;--p3:#c9b3ec;--p4:#ffffff}}
:root[data-theme="dark"]{--bg1:#1b0f2a;--bg2:#3a1630;--ink:#ffe8ee;--soft:#e3adc3;--card:rgba(58,22,48,.84);--line:rgba(255,143,171,.34);--btn:#ff8fab;--btnink:#3a1630;--p1:#ff8fab;--p2:#ffd68a;--p3:#c9b3ec;--p4:#ffffff}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(170deg,var(--bg1),var(--bg2));color:var(--ink);font-family:'Tajawal',system-ui,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;z-index:1}
#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center;padding:24px;z-index:5;transition:opacity .8s,visibility .8s}
#intro.off{opacity:0;visibility:hidden}
#intro h1{font-family:'Aref Ruqaa','Amiri',serif;font-size:clamp(34px,10vw,60px);line-height:1.5;margin:0;color:var(--p1)}
#intro p{margin:0;color:var(--soft);font-size:17px}
.go{font:700 19px/1 'Tajawal',system-ui,sans-serif;background:var(--btn);color:var(--btnink);border:0;border-radius:999px;padding:16px 36px;cursor:pointer}
.go:focus-visible{outline:3px solid var(--p1);outline-offset:4px}
#panel{position:fixed;left:50%;top:56%;width:min(90vw,26em);transform:translate(-50%,16px);opacity:0;transition:transform 1.2s cubic-bezier(.2,.8,.2,1),opacity 1.2s;text-align:center;z-index:4;pointer-events:none}
#panel.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
#panel h2{font-family:'Aref Ruqaa','Amiri',serif;font-size:30px;margin:0 0 6px;color:var(--p1)}
#panel p{margin:0 0 8px;font-size:17px;line-height:1.9}
#panel small{display:block;margin-top:12px;color:var(--soft);font-size:14px}
#snd{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:12px;width:44px;height:44px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:20px;cursor:pointer;z-index:6;display:grid;place-items:center}
#snd[hidden]{display:none}

/* Polaroid & Cake Modals */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:20;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .4s ease,visibility .4s ease;padding:16px}
.modal-overlay.open{opacity:1;visibility:visible}
.polaroid-box{background:#fff;border-radius:10px;padding:12px 12px 18px;box-shadow:0 14px 44px rgba(0,0,0,.35);width:min(86vw,320px);display:flex;flex-direction:column;align-items:center;position:relative;transform:scale(.92) rotate(-1.5deg);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.modal-overlay.open .polaroid-box{transform:scale(1) rotate(-1.5deg)}
.polaroid-img-wrap{width:100%;aspect-ratio:3/4;overflow:hidden;border-radius:6px;background:#f3e9ed;cursor:pointer}
.polaroid-img-wrap img{width:100%;height:100%;object-fit:cover;transition:opacity .3s ease;display:block}
.polaroid-caption{font-family:'Aref Ruqaa',serif;font-size:18px;color:#5e2440;margin:12px 0 4px;text-align:center;min-height:28px}
.modal-nav{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:8px;padding:0 6px}
.nav-arrow{background:var(--bg1);border:1px solid var(--line);color:var(--ink);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:16px;display:grid;place-items:center}
.dots{display:flex;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(94,36,64,.25);transition:background .3s,transform .3s;cursor:pointer}
.dot.active{background:var(--btn);transform:scale(1.25)}
.modal-close{position:absolute;top:-12px;right:-12px;width:34px;height:34px;background:var(--btn);color:#fff;border:0;border-radius:50%;font-size:16px;cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.3);z-index:10}

/* Cake Final Card styles */
.cake-box{padding:26px 20px 24px;text-align:center}
.cake-container{position:relative;width:150px;height:140px;margin:8px auto 16px}
.candle{position:absolute;top:4px;left:50%;transform:translateX(-50%);width:12px;height:42px;z-index:3}
.candle-body{width:10px;height:26px;background:repeating-linear-gradient(45deg,#ffd166,#ffd166 4px,#ff6b8b 4px,#ff6b8b 8px);border-radius:3px;position:absolute;bottom:0;left:1px}
.wick{width:2px;height:6px;background:#444;position:absolute;bottom:26px;left:5px}
.flame{position:absolute;bottom:30px;left:2px;width:8px;height:18px;background:radial-gradient(ellipse at bottom,#ffffff 0%,#ffd700 45%,#ff4500 85%);border-radius:50% 50% 35% 35%;box-shadow:0 0 14px #ffd700,0 0 24px #ff6b8b;animation:flicker 1.2s ease-in-out infinite alternate;transform-origin:bottom center}

@keyframes flicker{
  0%{transform:scale(1) rotate(-1deg)}
  50%{transform:scale(1.08,.94) rotate(2deg)}
  100%{transform:scale(.96,1.04) rotate(-2deg)}
}

.cake{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:130px;height:84px}
.cake-top{position:absolute;bottom:42px;left:15px;width:100px;height:34px;background:linear-gradient(to right,#ffcad4,#fbc3bc);border-radius:10px 10px 4px 4px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.06)}
.frosting-top{position:absolute;bottom:70px;left:12px;width:106px;height:12px;background:#ffffff;border-radius:8px 8px 4px 4px;box-shadow:0 2px 4px rgba(212,87,122,.15)}
.cake-bottom{position:absolute;bottom:8px;left:0;width:130px;height:40px;background:linear-gradient(to right,#ffb3c1,#fa9ba8);border-radius:8px 8px 4px 4px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.plate{position:absolute;bottom:0;left:-10px;width:150px;height:10px;background:#f0e4d7;border-radius:10px;box-shadow:0 3px 8px rgba(0,0,0,.15)}

.cake-title{font-family:'Aref Ruqaa',serif;font-size:23px;color:var(--p1);margin:6px 0 8px;line-height:1.4}
.cake-sub{font-size:16px;color:var(--ink);margin:0;line-height:1.7}

@media (prefers-reduced-motion:reduce){#panel,#intro{transition:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="snd" aria-label="كتم الصوت" hidden>🔊</button>

<section id="intro">
  <h1>في حاجة مستنياكي<br>يا إسراء</h1>
  <button class="go" id="start">افتحي</button>
  <p>ارفعي الصوت وتأكدي إن الموبايل مش على الصامت 🎶</p>
</section>

<section id="panel" aria-live="polite">
  <p>النهارده يومك، وانتي تستاهلي الدنيا كلها.</p>
  <p>ربنا يفرّحك على قد ما فرّحتي اللي حواليكي، ويكتبلك سنة كلها خير وضحك.</p>
  <p>شكراً إنك انتي انتي.</p>
</section>

<!-- Photos Modal -->
<div id="photo-modal" class="modal-overlay" aria-hidden="true">
  <div class="polaroid-box">
    <button class="modal-close" id="modal-close" aria-label="إغلاق">✕</button>
    <div class="polaroid-img-wrap" id="polaroid-tap">
      <img id="polaroid-img" src="images/photo1.jpg" alt="إسراء">
    </div>
    <p id="polaroid-cap" class="polaroid-caption">ضحكتك أحلى من البحر 🌊</p>
    <div class="modal-nav">
      <button id="p-prev" class="nav-arrow" aria-label="السابق">❮</button>
      <div class="dots" id="modal-dots"></div>
      <button id="p-next" class="nav-arrow" aria-label="التالي">❯</button>
    </div>
  </div>
</div>

<!-- Final Celebration Card Modal -->
<div id="cake-modal" class="modal-overlay" aria-hidden="true">
  <div class="polaroid-box cake-box">
    <button class="modal-close" id="cake-close" aria-label="إغلاق">✕</button>
    <div class="cake-container">
      <div class="candle">
        <div class="flame"></div>
        <div class="wick"></div>
        <div class="candle-body"></div>
      </div>
      <div class="cake">
        <div class="frosting-top"></div>
        <div class="cake-top"></div>
        <div class="cake-bottom"></div>
        <div class="plate"></div>
      </div>
    </div>
    <h3 class="cake-title">كل سنه وانتي طيبه يا قمررررررر 🎂</h3>
    <p class="cake-sub">ويارب تحققي كل اللي نفسك فيه ✨</p>
  </div>
</div>

<script>
const $=s=>document.querySelector(s), cv=$('#c'), cx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const SHAPES=[
  {lines:["إسراء"],font:'700 100px "Aref Ruqaa",serif'},
  {lines:["كل سنة وانتي طيبة","يا أجمل إسراء في الدنيا"],font:'700 100px "Aref Ruqaa",serif'},
  {combo:true}
];
let W,H,P=[],S=[],cols=[],ptr=null,cur=-1,on=false,T=0;

function readCols(){const g=getComputedStyle(document.documentElement);cols=['--p1','--p2','--p3','--p4'].map(v=>g.getPropertyValue(v).trim())}
function size(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function textPts(sh){
  const o=document.createElement('canvas');o.width=W;o.height=H;
  const c=o.getContext('2d');
  c.font=sh.font;
  const m=Math.max(...sh.lines.map(l=>c.measureText(l).width))||100;
  const fs=Math.min(100*W*.8/m,H*(sh.cap||(sh.lines.length>1?.15:.2)));
  c.font=sh.font.replace('100px',fs+'px');
  c.textAlign='center';c.textBaseline='middle';c.fillStyle='#000';
  const lh=fs*1.3,y0=H*(sh.y||.34)-(sh.lines.length-1)*lh/2;
  sh.lines.forEach((l,i)=>c.fillText(l,W/2,y0+i*lh));
  const d=c.getImageData(0,0,W,H).data,st=Math.max(3,Math.round(fs/34)),pts=[];
  for(let y=0;y<H;y+=st)for(let x=0;x<W;x+=st)if(d[(y*W+x)*4+3]>140)pts.push([x,y]);
  return pts.length?pts:[[W/2,H/3]];
}
function heartPts(n,cy,sc){
  const s=sc||Math.min(W*.34,H*.2),pts=[];
  while(pts.length<n){
    const x=Math.random()*2.8-1.4,y=Math.random()*2.8-1.4,a=x*x+y*y-1;
    if(a*a*a-x*x*y*y*y<=0)pts.push([W/2+x*s,(cy||H*.36)-y*s]);
  }
  return pts;
}
function setShape(i,boom){
  const sh=SHAPES[i];let pts;
  if(sh.combo){
    const n1=Math.floor(P.length*.3),tp=shuffle(textPts({lines:["SoUu"],font:'italic 700 100px Georgia,"Times New Roman",serif',y:.1,cap:.09})),
      hp=heartPts(P.length-n1,H*.37,Math.min(W*.3,H*.15));
    pts=P.map((_,k)=>k<n1?tp[k%tp.length]:hp[k-n1]);
  }else pts=shuffle(textPts(sh));
  P.forEach((p,k)=>{
    const t=pts[k%pts.length];
    p.tx=t[0]+(Math.random()-.5)*1.5;p.ty=t[1]+(Math.random()-.5)*1.5;
    if(boom&&!reduce){const a=Math.random()*6.283,s=6+Math.random()*14;p.vx=Math.cos(a)*s;p.vy=Math.sin(a)*s}
  });
}
function fw(x,y){
  const n=reduce?14:48,c0=Math.floor(Math.random()*4);
  for(let i=0;i<n;i++){const a=Math.random()*6.283,s=1.5+Math.random()*5;
    S.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:55+Math.random()*35,c:Math.random()<.7?c0:Math.floor(Math.random()*4)})}
}
function rnd(n,gap){for(let i=0;i<n;i++)setTimeout(()=>fw(W*(.15+Math.random()*.7),H*(.12+Math.random()*.4)),i*gap)}

function frame(){
  T++;
  for(const p of P){
    let ax=(p.tx-p.x)*.055,ay=(p.ty-p.y)*.055;
    if(ptr){const dx=p.x-ptr.x,dy=p.y-ptr.y,d2=dx*dx+dy*dy;
      if(d2<9000){const f=(1-d2/9000)*6.6/(Math.sqrt(d2)+.1);ax+=dx*f;ay+=dy*f}}
    p.vx=(p.vx+ax)*.86;p.vy=(p.vy+ay)*.86;
    p.x+=p.vx+Math.sin(T*.03+p.r*9)*.12;p.y+=p.vy+Math.cos(T*.03+p.r*7)*.12;
  }
  for(const s of S){s.vx*=.985;s.vy=s.vy*.985+.05;s.x+=s.vx;s.y+=s.vy;s.l--}
  S=S.filter(s=>s.l>0);
  cx.clearRect(0,0,W,H);
  for(let k=0;k<4;k++){cx.fillStyle=cols[k];for(const p of P)if(p.c===k)cx.fillRect(p.x,p.y,p.r*2,p.r*2)}
  for(const s of S){cx.globalAlpha=Math.min(1,s.l/30);cx.fillStyle=cols[s.c];cx.fillRect(s.x,s.y,3,3)}
  cx.globalAlpha=1;
  requestAnimationFrame(frame);
}
function next(boom){
  cur++;setShape(cur,boom);
  if(boom)rnd(2,250);
  if(cur<SHAPES.length-1)setTimeout(()=>next(true),cur===0?3200:4000);
  else{
    rnd(4,300);
    setTimeout(()=>$('#panel').classList.add('on'),1200);
    setInterval(()=>rnd(2,400),2400);
    setTimeout(openPhotosModal, 4000);
  }
}
async function start(){
  audioOn();
  try{await document.fonts.load('700 100px "Aref Ruqaa"','إسراء كل سنة وانتي طيبة يا أجمل في الدنيا')}catch(e){}
  $('#intro').classList.add('off');
  size();readCols();
  const N=W<600?1400:2200;
  for(let k=0;k<N;k++)P.push({x:Math.random()*W,y:Math.random()*H,vx:0,vy:0,tx:W/2,ty:H/2,c:k%4,r:1+Math.random()*1.1});
  on=true;frame();next(false);
}
let ac,out,bus,nextT=0,muted=false;
const BEAT=60/90,NF=n=>440*Math.pow(2,(n-69)/12);
const M=s=>12*(+s.slice(-1)+1)+{C:0,D:2,E:4,F:5,G:7,A:9,B:11}[s[0]]+(s[1]==='#'?1:0);
const MEL=[["D4",0],["D4",.75],["E4",1],["D4",2],["G4",3],["F#4",4],
["D4",6],["D4",6.75],["E4",7],["D4",8],["A4",9],["G4",10],
["D4",12],["D4",12.75],["D5",13],["B4",14],["G4",15],["F#4",16],["E4",17],
["C5",18],["C5",18.75],["B4",19],["G4",20],["A4",21],["G4",22]];
const CH=[["G2","B3","D4","F#4"],["D3","A3","C4","F#4"],["A2","C4","E4","G4"],["G2","B3","D4","F#4"],["G2","B3","D4","G4"],["D3","A3","C4","F#4"],["C3","B3","E4","G4"],["G2","B3","D4","F#4"]];
function tone(t,f,type,v,att,dec,lp){
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+att+dec);
  let n=o;if(lp){const l=ac.createBiquadFilter();l.type='lowpass';l.frequency.value=lp;o.connect(l);n=l}
  n.connect(g);g.connect(bus);o.start(t);o.stop(t+att+dec+.1);
}
function bell(t,f,v){[[1,1],[2,.3],[3,.12],[5.4,.05]].forEach(([r,a])=>tone(t,f*r,'sine',v*a,.005,2.4/r))}
function sched(t0){
  MEL.forEach(([n,b])=>bell(t0+b*BEAT,NF(M(n)+12),.2));
  CH.forEach((c,i)=>{
    const s=t0+(1+3*i)*BEAT,bn=NF(M(c[0]));
    tone(s,bn,'sine',.3,.01,1.1);tone(s,bn*2,'triangle',.08,.01,.7);
    [1,2].forEach(k=>c.slice(1).forEach(n=>tone(s+k*BEAT,NF(M(n)),'triangle',.035,.02,.55,1400)));
  });
}
function tick(){if(ac.currentTime>nextT-4){sched(nextT);nextT+=28*BEAT}}
function audioOn(){
  try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  ac.resume();
  out=ac.createGain();out.gain.value=.8;out.connect(ac.destination);
  bus=ac.createGain();bus.connect(out);
  const v=ac.createConvolver(),len=Math.floor(ac.sampleRate*2.8),b=ac.createBuffer(2,len,ac.sampleRate);
  for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
  v.buffer=b;const wg=ac.createGain();wg.gain.value=.55;bus.connect(v);v.connect(wg);wg.connect(out);
  nextT=ac.currentTime+.4;tick();setInterval(tick,500);
  const s=$('#snd');s.hidden=false;
  s.onclick=()=>{muted=!muted;out.gain.setTargetAtTime(muted?0:.8,ac.currentTime,.1);s.textContent=muted?'🔇':'🔊';s.setAttribute('aria-label',muted?'تشغيل الصوت':'كتم الصوت')};
}
document.addEventListener('visibilitychange',()=>{if(!ac)return;document.hidden?ac.suspend():ac.resume()});
$('#start').addEventListener('click',start);
cv.addEventListener('pointerdown',e=>{ptr={x:e.clientX,y:e.clientY};if(on)fw(e.clientX,e.clientY)});
cv.addEventListener('pointermove',e=>{if(ptr||e.pointerType==='mouse')ptr={x:e.clientX,y:e.clientY}});
['pointerup','pointercancel','pointerleave'].forEach(t=>cv.addEventListener(t,()=>{ptr=null}));
addEventListener('resize',()=>{if(!on)return;size();setShape(cur,false)});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readCols);
size();readCols();

/* Photos Modal Logic + Autoplay */
const photos=[
  {src:'images/photo1.jpg',cap:'ضحكتك أحلى من البحر 🌊'},
  {src:'images/photo2.jpg',cap:'وجودك بيحلّي أي مكان ☕'},
  {src:'images/photo3.jpg',cap:'أجمل واحدة في الدنيا ✨'},
  {src:'images/photo4.jpg',cap:'قمر منور في أي مكان 🌙'},
  {src:'images/photo5.jpg',cap:'ضحكة تفرّح القلب وتهوّن أي حاجة 💫'}
];
let photoIdx=0, autoSlideTimer=null;
const pModal=$('#photo-modal'), pImg=$('#polaroid-img'), pCap=$('#polaroid-cap'), pDotsBox=$('#modal-dots');
const cModal=$('#cake-modal');

/* Create dots dynamically */
pDotsBox.innerHTML=photos.map((_,i)=>`<span class="dot${i===0?' active':''}" data-i="${i}"></span>`).join('');
const pDots=pDotsBox.querySelectorAll('.dot');

function updatePhoto(idx){
  photoIdx=(idx+photos.length)%photos.length;
  pImg.style.opacity='0';
  setTimeout(()=>{
    pImg.src=photos[photoIdx].src;
    pCap.textContent=photos[photoIdx].cap;
    pImg.style.opacity='1';
  },180);
  pDots.forEach((d,i)=>d.classList.toggle('active',i===photoIdx));
}

function startAutoSlide(){
  clearInterval(autoSlideTimer);
  autoSlideTimer=setInterval(()=>{
    if(photoIdx>=photos.length-1){
      stopAutoSlide();
      setTimeout(()=>{
        closePhotosModal();
        setTimeout(openCakeModal,450);
      },3500);
      return;
    }
    updatePhoto(photoIdx+1);
  }, 3500);
}

function stopAutoSlide(){
  clearInterval(autoSlideTimer);
}

function openPhotosModal(){
  updatePhoto(0);
  pModal.classList.add('open');
  startAutoSlide();
}

function closePhotosModal(){
  pModal.classList.remove('open');
  stopAutoSlide();
}

$('#modal-close').addEventListener('click', closePhotosModal);
pModal.addEventListener('click', e=>{if(e.target===pModal) closePhotosModal();});

$('#p-next').addEventListener('click', ()=>{
  if(photoIdx>=photos.length-1){
    closePhotosModal();
    setTimeout(openCakeModal,350);
    return;
  }
  updatePhoto(photoIdx+1);
  startAutoSlide();
});
$('#p-prev').addEventListener('click', ()=>{
  updatePhoto(photoIdx-1);
  startAutoSlide();
});
$('#polaroid-tap').addEventListener('click', ()=>{
  if(photoIdx>=photos.length-1){
    closePhotosModal();
    setTimeout(openCakeModal,350);
    return;
  }
  updatePhoto(photoIdx+1);
  startAutoSlide();
});
pDots.forEach((d,i)=>{
  d.addEventListener('click', ()=>{
    updatePhoto(i);
    startAutoSlide();
  });
});

/* Final Card Logic */
function openCakeModal(){
  cModal.classList.add('open');
  // Trigger celebration fireworks automatically
  rnd(8, 200);
  setInterval(()=>rnd(2, 400), 2400);

  // Soft celebratory bell chime
  if(typeof bell==='function'&&ac){
    const t=ac.currentTime;
    [523.25, 659.25, 783.99, 1046.50].forEach((f,i)=>{
      bell(t+i*0.12, f, 0.22);
    });
  }
}
function closeCakeModal(){
  cModal.classList.remove('open');
}
$('#cake-close').addEventListener('click', closeCakeModal);
cModal.addEventListener('click', e=>{if(e.target===cModal) closeCakeModal();});
</script>
